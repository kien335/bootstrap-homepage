
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Homepage</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .carousel-item img {
            height: 400px;
            object-fit: cover;
        }

        @media (max-width: 768px) {
            .carousel-item img {
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-home"></i> MyWebsite
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Mở menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#welcome">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#services">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Carousel -->
    <div id="heroCarousel"
         class="carousel slide"
         data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img
                    src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=1400&q=80"
                    class="d-block w-100"
                    alt="Slide 1">
            </div>

            <div class="carousel-item">
                <img
                    src="https://images.unsplash.com/photo-1521737711867-e3b97375f902?w=1400&q=80"
                    class="d-block w-100"
                    alt="Slide 2">
            </div>

        </div>

        <button class="carousel-control-prev"
                type="button"
                data-bs-target="#heroCarousel"
                data-bs-slide="prev"
                aria-label="Ảnh trước">
            <span class="carousel-control-prev-icon"
                  aria-hidden="true"></span>
        </button>

        <button class="carousel-control-next"
                type="button"
                data-bs-target="#heroCarousel"
                data-bs-slide="next"
                aria-label="Ảnh tiếp theo">
            <span class="carousel-control-next-icon"
                  aria-hidden="true"></span>
        </button>
    </div>

    <!-- Flexbox Section -->
    <section id="welcome"
             class="d-flex justify-content-center align-items-center bg-light py-5 px-3 text-center">
        <h2>Chào mừng đến với trang web của chúng tôi!</h2>
    </section>

    <!-- Services -->
    <section id="services" class="container py-4 text-center">
        <h2>Dịch vụ của chúng tôi</h2>
        <p>Chúng tôi cung cấp các giải pháp công nghệ chuyên nghiệp.</p>
    </section>

    <!-- Contact Form -->
    <section id="contact" class="container my-5">
        <h2 class="text-center mb-4">Liên hệ với chúng tôi</h2>

        <form>
            <div class="mb-3">
                <label for="name" class="form-label">
                    Tên của bạn
                </label>
                <input type="text"
                       class="form-control"
                       id="name"
                       placeholder="Nhập tên"
                       required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    Email
                </label>
                <input type="email"
                       class="form-control"
                       id="email"
                       placeholder="Nhập email"
                       required>
            </div>

            <button type="submit" class="btn btn-primary">
                Gửi
            </button>
        </form>
    </section>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
